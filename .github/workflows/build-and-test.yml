name: Build and test

# Checks that the app builds and its unit tests pass. It never signs or publishes anything:
# releases are built and signed locally, so the signing key never leaves the maintainer's machine.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Build and test
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

      # an unsigned release build; its checksum must match a local build of the same commit,
      # which shows the build is reproducible across machines (F-Droid builds on Linux)
      - name: Build unsigned release and print its checksum
        run: |
          ./gradlew assembleRelease -PPSYJOURNAL_STORE_FILE= --no-daemon
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
